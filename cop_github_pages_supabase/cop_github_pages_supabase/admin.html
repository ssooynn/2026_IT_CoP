<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 페이지</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container wide">
    <div class="card hero">
      <div class="row space-between align-center">
        <div>
          <h1>관리자 페이지</h1>
          <p class="subtle">심사위원 등록 / 응답 확인 / 순위 저장</p>
        </div>
        <div class="actions">
          <a class="button secondary" href="index.html">심사위원 화면</a>
          <button id="admin-logout-btn" type="button" class="danger hidden">로그아웃</button>
        </div>
      </div>
    </div>

    <div id="admin-login-card" class="card narrow-card">
      <h2>관리자 로그인</h2>
      <form id="admin-login-form">
        <label for="admin-email">이메일</label>
        <input id="admin-email" type="email" required placeholder="admin@example.com" />
        <label for="admin-password">비밀번호</label>
        <input id="admin-password" type="password" required />
        <button type="submit">로그인</button>
      </form>
      <div id="admin-login-message" class="message"></div>
    </div>

    <div id="admin-content" class="hidden">
      <div class="card">
        <h2>심사위원 등록</h2>
        <form id="judge-create-form" class="inline-form">
          <div>
            <label for="new-emp-no">직원번호</label>
            <input id="new-emp-no" type="text" required placeholder="0101011" />
          </div>
          <div class="grow">
            <label for="new-display-name">표시 이름</label>
            <input id="new-display-name" type="text" required placeholder="기획부 김홍동 대리" />
          </div>
          <div>
            <label for="new-active">상태</label>
            <select id="new-active">
              <option value="true">활성</option>
              <option value="false">비활성</option>
            </select>
          </div>
          <div class="submit-cell">
            <button type="submit">추가</button>
          </div>
        </form>
        <div id="judge-create-message" class="message"></div>
      </div>

      <div class="card">
        <div class="row space-between align-center">
          <h2>심사위원 목록</h2>
          <button id="refresh-admin-btn" type="button" class="secondary">새로고침</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>직원번호</th>
                <th>표시 이름</th>
                <th>상태</th>
                <th>저장</th>
              </tr>
            </thead>
            <tbody id="judges-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="row space-between align-center">
          <h2>평가 현황</h2>
          <div class="actions">
            <button id="download-excel-btn" type="button" class="secondary">Excel 다운로드</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>심사위원</th>
                <th>직원번호</th>
                <th>상태</th>
                <th>입력수</th>
                <th>수정시각</th>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
                <th>E</th>
                <th>F</th>
                <th>상세</th>
              </tr>
            </thead>
            <tbody id="responses-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="row space-between align-center">
          <h2>팀별 순위 산정</h2>
          <div class="actions">
            <button id="calculate-ranking-btn" type="button" class="secondary">다시 계산</button>
            <button id="save-ranking-btn" type="button">팀별 점수·순위 저장</button>
          </div>
        </div>
        <p class="help">제출 완료된 심사위원 점수만 반영하며, 각 팀별 최고점 1개와 최저점 1개를 제외한 평균으로 산정합니다. 제출 인원이 3명 미만이면 제외 없이 평균합니다.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>순위</th>
                <th>팀</th>
                <th>제출 인원</th>
                <th>최고점 제외</th>
                <th>최저점 제외</th>
                <th>산정 평균</th>
              </tr>
            </thead>
            <tbody id="ranking-table-body"></tbody>
          </table>
        </div>
        <div id="save-ranking-message" class="message"></div>
      </div>

      <div class="card">
        <h2>최근 저장된 순위</h2>
        <div id="latest-snapshot" class="subtle">저장된 순위가 없습니다.</div>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
