<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoP 결과발표회 평가시스템</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container narrow">
    <div class="card hero">
      <h1>CoP 결과발표회 평가시스템</h1>
      <p class="subtle">GitHub Pages + Supabase 버전</p>
    </div>

    <div class="card">
      <h2>심사위원 로그인</h2>
      <p class="help">직원번호를 입력하면 관리자가 등록한 이름으로 로그인됩니다.</p>
      <form id="judge-login-form">
        <label for="empNo">직원번호</label>
        <input id="empNo" name="empNo" type="text" placeholder="예: 0101011" required />
        <button type="submit">심사위원 로그인</button>
      </form>
      <div id="judge-login-message" class="message"></div>
    </div>

    <div class="card">
      <h2>관리자</h2>
      <p class="help">관리자는 Supabase 이메일 계정으로 로그인합니다.</p>
      <a class="button secondary" href="admin.html">관리자 페이지로 이동</a>
    </div>
  </div>

  <script type="module" src="js/index.js"></script>
</body>
</html>
